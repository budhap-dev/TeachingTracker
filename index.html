<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            AbhiTutor — Where confidence takes off.
        </title>
        <meta
            name="description"
            content="Personal tutoring in maths and the sciences for Years 7–13, online or in person. Matched to your exam board, planned around the school week."
        />
        <!-- Share previews (REQ-023). Static so crawlers that skip JS still
             see them; the SPA refines title/description per route at runtime. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="AbhiTutor" />
        <meta property="og:url" content="https://abhitutor.co.uk/" />
        <meta
            property="og:title"
            content="AbhiTutor — Where confidence takes off."
        />
        <meta
            property="og:description"
            content="Personal tutoring in maths and the sciences for Years 7–13, online or in person. Matched to your exam board, planned around the school week."
        />
        <meta name="twitter:card" content="summary" />
        <meta name="theme-color" content="#0284c7" />
        <link rel="icon" type="image/svg+xml" href="/badge.svg" />
        <!-- Installable as an app from the browser (Add to Home Screen /
             Install): the manifest gives the full-bleed badge icon and a
             standalone, no-URL-bar launch. iOS reads the touch icon + metas
             (it ignores SVG favicons entirely). -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="AbhiTutor" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
