name: Deploy frontend to environment

# Reusable workflow: builds the frontend for one environment and deploys it to
# that environment's Static Web App.
#
# The GitHub Environment (dev/prod) supplies:
#   - vars.VITE_API_BASE_URL              -> the matching Function App URL (+/api)
#   - vars.VITE_ENTRA_TENANT_ID           -> Entra tenant (REQ-004 sign-in)
#   - vars.VITE_ENTRA_SPA_CLIENT_ID       -> that env's SPA app registration
#   - vars.VITE_ENTRA_API_SCOPE           -> the API scope MSAL requests
#   - secrets.AZURE_STATIC_WEB_APPS_API_TOKEN -> that SWA's deployment token
# and any protection rules (e.g. required reviewers on prod).
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod).
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A fresh version every deploy: package.json's major.minor with the run
      # number as the patch, so the sidebar shows it tick up on each release.
      - name: Compute build version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "APP_VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build (bakes in this environment's API URL + Entra config)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.VITE_ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          # The badge's ring colour keys off this: prod sky, everything
          # else yellow — the two apps can never be mistaken.
          VITE_APP_ENV: ${{ inputs.environment }}

      # Non-prod installs must be tellable from prod at a glance: the home
      # screen icon wears a yellow ring and the install is named "(dev)".
      # Prod's assets stay byte-identical — this step never runs for it.
      - name: Mark dev install assets
        if: ${{ inputs.environment != 'prod' }}
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist/manifest.webmanifest', 'utf8'));
            m.name = 'AbhiTutor (dev)';
            m.short_name = 'AbhiTutor dev';
            m.icons = m.icons.map((icon) => ({
              ...icon,
              src: icon.src.replace('/icons/', '/icons-dev/'),
            }));
            fs.writeFileSync('dist/manifest.webmanifest', JSON.stringify(m, null, 2));
          "
          sed -i 's|/icons/apple-touch-icon.png|/icons-dev/apple-touch-icon.png|; s|/badge.svg|/badge-dev.svg|' dist/index.html

      # What this environment runs, fetchable from the live site itself:
      # https://<site>/version.json — no need to dig through Actions runs.
      - name: Stamp version.json
        run: |
          cat > dist/version.json <<EOF
          {
            "environment": "${{ inputs.environment }}",
            "version": "$APP_VERSION",
            "commit": "${{ github.sha }}",
            "deployedAt": "$(date -u +%FT%TZ)"
          }
          EOF

      - name: Deploy to Azure Static Web Apps (${{ inputs.environment }})
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true

      # The run's Summary answers "what went where" without opening logs.
      - name: Record what this environment now runs
        run: |
          {
            echo "## ✅ ${{ inputs.environment }} now runs $APP_VERSION"
            echo ""
            echo "| Version | Commit | Deployed (UTC) |"
            echo "|---|---|---|"
            echo "| $APP_VERSION | \`${{ github.sha }}\` | $(date -u +'%F %T') |"
            echo ""
            echo "Both environments at a glance: Actions → **Environment status**, or \`/version.json\` on the live site."
          } >> "$GITHUB_STEP_SUMMARY"
