name: Deploy frontend to environment

# Reusable workflow: builds the frontend for one environment and deploys it to
# that environment's Static Web App.
#
# The GitHub Environment (dev/prod) supplies:
#   - vars.VITE_API_BASE_URL              -> the matching Function App URL (+/api)
#   - vars.VITE_ENTRA_TENANT_ID           -> Entra tenant (REQ-004 sign-in)
#   - vars.VITE_ENTRA_SPA_CLIENT_ID       -> that env's SPA app registration
#   - vars.VITE_ENTRA_API_SCOPE           -> the API scope MSAL requests
#   - secrets.AZURE_STATIC_WEB_APPS_API_TOKEN -> that SWA's deployment token
# and any protection rules (e.g. required reviewers on prod).
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod).
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A fresh version every deploy: package.json's major.minor with the run
      # number as the patch, so the sidebar shows it tick up on each release.
      - name: Compute build version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "APP_VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build (bakes in this environment's API URL + Entra config)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.VITE_ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Deploy to Azure Static Web Apps (${{ inputs.environment }})
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
