name: Deploy frontend to environment

# Reusable workflow: builds the frontend for one environment and deploys it to
# that environment's Static Web App.
#
# The GitHub Environment (dev/test/prod) supplies:
#   - vars.VITE_API_BASE_URL              -> the matching Function App URL (+/api)
#   - secrets.AZURE_STATIC_WEB_APPS_API_TOKEN -> that SWA's deployment token
# and any protection rules (e.g. required reviewers on prod).
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev, test, or prod).
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (bakes in this environment's API URL)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Azure Static Web Apps (${{ inputs.environment }})
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
