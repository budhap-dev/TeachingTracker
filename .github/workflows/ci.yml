name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # REQ-040: fail the build on known-vulnerable dependencies.
            # Shipped dependencies only: dev-tooling advisories (e.g. the
            # esbuild dev-server one) can't reach production and their fixes
            # are major-version churn — Dependabot still surfaces them.
            - name: Audit shipped dependencies (high+)
              run: npm audit --audit-level=high --omit=dev

            - name: Run lint
              run: npm run lint

            - name: Run tests with coverage
              run: npm run test:coverage

            - name: Build app
              run: npm run build

    # REQ-045: the bundled defaults are mirrored in the API repo, and the
    # mirror was discipline until it drifted twice. Each repo snapshots its
    # own defaults to site-content.default.json (a unit test keeps that
    # honest); this job proves the two files are the same.
    #
    # Cross-repo reads need a token GITHUB_TOKEN cannot provide: set the
    # CONTENT_DRIFT_TOKEN secret (a fine-grained PAT with read-only Contents
    # on both repos) to arm it. Without the secret the job says so loudly
    # and passes, rather than blocking every PR on unfinished setup.
    content-drift:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Fetch the API repo's snapshot
              id: peer
              env:
                  GH_TOKEN: ${{ secrets.CONTENT_DRIFT_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "::warning title=Drift check skipped::CONTENT_DRIFT_TOKEN is not set, so the API repo's defaults were not compared."
                    echo "skipped=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  gh api repos/budhap-dev/func-teaching-tracker/contents/site-content.default.json \
                    -H "Accept: application/vnd.github.raw" > peer-site-content.default.json

            - name: Compare the bundled defaults
              if: steps.peer.outputs.skipped != 'true'
              run: |
                  if ! diff -u peer-site-content.default.json site-content.default.json; then
                    echo "::error title=Default content drift::This repo's bundled defaults differ from the API repo's. Bring both sides into line, run 'npx vitest -u' in each, and commit the snapshots."
                    exit 1
                  fi
                  echo "Bundled defaults match the API repo."
