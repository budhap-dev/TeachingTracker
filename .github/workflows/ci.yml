name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # REQ-040: fail the build on known-vulnerable dependencies.
            # Shipped dependencies only: dev-tooling advisories (e.g. the
            # esbuild dev-server one) can't reach production and their fixes
            # are major-version churn — Dependabot still surfaces them.
            - name: Audit shipped dependencies (high+)
              run: npm audit --audit-level=high --omit=dev

            - name: Run lint
              run: npm run lint

            - name: Run tests with coverage
              run: npm run test:coverage

            - name: Build app
              run: npm run build
