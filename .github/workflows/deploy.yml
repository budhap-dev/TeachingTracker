name: Deploy
# One pipeline for both environments: dev (auto) → approval → prod. The run
# graph shows both stages together, so it's clear which commit is going where.
run-name: "Deploy ${{ github.sha }} → dev, then prod on approval"

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: checkout · issues: the approval gate opens/closes its issue.
permissions:
  contents: read
  issues: write

# The frontend bakes VITE_API_BASE_URL in at build time, so (unlike the API)
# each environment is built separately with its own API URL and Entra config.
jobs:
  # Stage 1 — every push auto-builds and deploys to dev.
  dev:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
    secrets: inherit

  # Manual gate — pauses the run until an approver comments on the auto-opened
  # issue. The free-plan stand-in for a GitHub Environment required-reviewer
  # rule; prod stays greyed/pending until this passes.
  approve-prod:
    needs: dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Await production approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.token }}
          approvers: budhap-dev
          minimum-approvals: 1
          issue-title: "Deploy ${{ github.sha }} to production?"
          issue-body: >
            This commit is live on **dev**. Comment `approved` to promote it to
            **prod**, or `denied` to stop. Auto-fails after 60 minutes.

  # Stage 2 — build with prod config and deploy to prod once approved.
  prod:
    needs: approve-prod
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
    secrets: inherit
