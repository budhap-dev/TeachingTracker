name: Deploy
# One workflow, both environments. Push auto-deploys dev; prod is a manual
# promotion (Actions → Run workflow). No waiting/polling job, so nothing logs
# or burns minutes while a manual approval is pending — promote whenever.
run-name: "Deploy: ${{ github.event.head_commit.message || github.sha }} (@${{ github.actor }})"

on:
  push:
    branches: [main]
  workflow_dispatch: # = promote this commit to prod

permissions:
  contents: read

# The frontend bakes VITE_API_BASE_URL in at build time, so (unlike the API)
# each environment is built separately with its own API URL and Entra config.
jobs:
  # Auto — every push to main builds and deploys to dev. Skipped on a manual run.
  dev:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
    secrets: inherit

  # Manual — promote to prod by running this workflow (Actions → Run workflow).
  # Skipped (greyed) on push runs, so it's clearly the gated stage without any
  # job sitting and polling for approval.
  prod:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
    secrets: inherit
