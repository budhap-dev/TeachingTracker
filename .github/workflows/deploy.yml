name: Build & Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The frontend bakes VITE_API_BASE_URL in at build time, so (unlike the API)
# each environment is built separately with its own API URL. On push, dev is
# deployed automatically; production is deployed separately and manually via
# deploy-prod.yml.
jobs:
  dev:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
    secrets: inherit
