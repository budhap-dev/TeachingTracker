# REQ-040: dependency alerts. Weekly, grouped, so updates arrive as a
# reviewable batch instead of a PR per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 is out ahead of typescript-eslint's peer range —
      # the group bump ERESOLVEs (#88). Drop this once typescript-eslint
      # supports TS 7, then let Dependabot offer the major again.
      - dependency-name: typescript
        versions: ['>=7']
      # The React-Compiler-era hooks rules (purity, set-state-in-effect)
      # flag the app's deliberate adopt-until-edited draft pattern in ten
      # places (#91). Adopting them is a scheduled refactor (REQ-050),
      # not a dependency bump side effect.
      - dependency-name: eslint-plugin-react-hooks
        versions: ['>=6']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
